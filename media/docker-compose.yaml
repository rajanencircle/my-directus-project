services:
  fw-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64 # SQL Server has no arm64 image; emulated on Apple Silicon
    container_name: fw-mediabotg-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - ./:/var/opt/mssql/backup:ro # this folder, so fw-mediabotg.bak is visible in-container
      - fw-mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  fw-mongo:
    image: mongo:4.4 # matches the live FotoWeb MongoDB version; native arm64 image, no emulation needed
    container_name: fw-mediabotg-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./MongoBackup:/dump:ro # mongodump output from the live FotoWare server
      - fw-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  fw-mssql-data:
  fw-mongo-data:
